# Disposable, owner-authorized one-branch public native proof. No production access.
# Existing manual workflows remain untouched. Never merge this experiment into main.
name: W07 public native proof (GAME and broker only)
on:
  push:
    branches: ['lab/w07-public-native-once-20261124']
    paths: ['.github/workflows/w07-public-native-once.yml']
permissions:
  contents: read
concurrency:
  group: w07-public-native-once
  cancel-in-progress: false
jobs:
  core-mariadb:
    if: ${{ github.repository == 'Otiosun/Crownicles-wa-lab' && github.event_name == 'push' && github.ref == 'refs/heads/lab/w07-public-native-once-20261124' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: ci_only_root_7f53b1
          MARIADB_USER: draftbot
          MARIADB_PASSWORD: ci_only_game_6d39a4
          MARIADB_DATABASE: bootstrap_ci_only
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_ROOT_USER: root
      TEST_DB_ROOT_PASSWORD: ci_only_root_7f53b1
      TEST_DB_USER: draftbot
      TEST_DB_PASSWORD: ci_only_game_6d39a4
    steps:
      - name: Check out immutable already-public PR8 harness
        uses: actions/checkout@v4
        with:
          ref: 73039e929935652f099134f62b34236e121a8cea
          persist-credentials: false
      - name: Verify exact source and scope before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Otiosun/Crownicles-wa-lab'
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/w07-public-native-once-20261124'
          test "$(git rev-parse HEAD)" = 73039e929935652f099134f62b34236e121a8cea
          test "$(id -u)" != 0
      - name: Verify complete pinned JUnit gate before native build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_core_junit_full_suite.py' -v
      - name: Refuse other repos and non-isolated database targets
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_DB_HOST" = 127.0.0.1
          test "$TEST_DB_PORT" = 3306
          test -f integration/wa-equip-action.integration.test.ts
          test -f tools/verify_core_junit.py
      - name: Check out immutable upstream Crownicles (read-only)
        uses: actions/checkout@v4
        with:
          repository: Crownicles/Crownicles
          ref: 64d08c05f11949029317341735f6f73024f19f9b
          path: upstream
          persist-credentials: false
      - name: Pin exact official Core source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 64d08c05f11949029317341735f6f73024f19f9b
          test -f upstream/Core/__tests__-integration/_coreSetup.ts
          test -f upstream/Core/__tests__-integration/_setup.ts
          test -f upstream/Core/vitest.integration.config.mts
          test -f upstream/Core/config/config.default.toml
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install official pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - name: Install original Lib and Core dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir upstream/Lib install --frozen-lockfile
          pnpm --dir upstream/Core install --frozen-lockfile
      - name: Prepare original bootstrap config for disposable runner
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/Core/config/config.default.toml upstream/Core/config/config.toml
          test -f upstream/Core/config/config.toml
          cp integration/wa-equip-action.integration.test.ts upstream/Core/__tests__-integration/handlers/wa-equip-action.integration.test.ts
      - name: Execute upstream MariaDB integration suite and seven equip scenarios
        id: core
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm --dir upstream/Core test:integration
      - name: Mandatory integrity and results gate
        if: always()
        shell: bash
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
        run: |
          set -euo pipefail
          test "$CORE_OUTCOME" = success || { echo 'CORE_MARIADB_LAB_FAILED: upstream suite or compilation failed'; exit 1; }
          python3 tools/verify_core_junit.py upstream/Core/test-integration-results.xml
          printf 'UPSTREAM_MARIADB_EQUIP_GATE_PASSED\n' > core-mariadb-gate-status.txt
      - name: Upload sanitized laboratory evidence on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crownicles-core-mariadb-audit
          path: |
            upstream/Core/test-integration-results.xml
            core-mariadb-gate-status.txt
          if-no-files-found: error
          retention-days: 2
  mosquitto-native:
    if: ${{ github.repository == 'Otiosun/Crownicles-wa-lab' && github.event_name == 'push' && github.ref == 'refs/heads/lab/w07-public-native-once-20261124' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CROWNICLES_P0C_NO_PRODUCTION: "true"
    steps:
      - name: Check out immutable already-public PR11 harness
        uses: actions/checkout@v4
        with:
          ref: 13471ab972847fbccb370172d077535b3140eceb
          persist-credentials: false
      - name: Verify exact unchanged W44 source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$CROWNICLES_P0C_NO_PRODUCTION" = true
          test "$GITHUB_REPOSITORY" = 'Otiosun/Crownicles-wa-lab'
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/w07-public-native-once-20261124'
          test "$(git rev-parse HEAD)" = 13471ab972847fbccb370172d077535b3140eceb
          test "$GITHUB_WORKSPACE" != ''
          test "$(id -u)" != 0
          printf '%s\n' \
            '83b1729055cbb4027b68208811450937deb1d90090d404eff4a2b48526177beb  candidate/bridge/mqtt-auth-lab.cjs' \
            '8b6106bc10d63b8b2ee0391f41c2bcd101cdfc11b50ade0a96eab563825ca674  consolidated/evidence/e1-mqtt-w44-native-broker-probe.cjs' \
            '830f1638501477c943d4cc8303ce8b68dedaec0594a4283a01aa94204f5602c4  tools/w46_raw_mqtt_probe.cjs' \
            | sha256sum -c -
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native Mosquitto in disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mosquitto
          sudo systemctl stop mosquitto || true
          command -v mosquitto
          command -v mosquitto_passwd
          mosquitto -h 2>&1 | sed -n '1p'
      - name: Test wire-codec and W44 provenance without broker mocks claiming native
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/w46_raw_mqtt_probe.test.cjs
      - name: Execute authenticated real TCP MQTT broker/ACL probe
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          # No usernames, passwords or broker config are logged or uploaded.
          node tools/w46_raw_mqtt_probe.cjs "$GITHUB_WORKSPACE/candidate/bridge/mqtt-auth-lab.cjs" > mqtt-native-result.json
          python3 - <<'PY'
          import json
          r=json.load(open('mqtt-native-result.json',encoding='utf-8'))
          assert r.get('schema')=='crownicles-w46-mqtt-native-v2'
          assert r.get('status')=='PASS' and r.get('executedBroker') is True
          assert r.get('homologated') is False and r.get('productionTouched') is False
          assert r.get('reason')=='NATIVE_MOSQUITTO_AUTH_DELIVERY_ACL_AND_BOTH_DIRECTIONS'
          assert r.get('w44SourceSha256')=='83b1729055cbb4027b68208811450937deb1d90090d404eff4a2b48526177beb'
          assert r.get('coreOriginalExecuted') is False
          assert r.get('subscriptionSemantics') in ('ALL_DENIED_SUBACK','GRANTS_POSSIBLE_DELIVERY_ACL_VERIFIED')
          assert not any('pass' in k.lower() or 'secret' in k.lower() for k in r)
          print('W46_NATIVE_MQTT_BROKER_ACL_PASS_ONLY; CORE_WIRE_NOT_TESTED; GATES_OFF')
          PY
      - name: Preserve sanitized successful broker result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crownicles-w46-native-mqtt-result
          path: mqtt-native-result.json
          if-no-files-found: error
          retention-days: 2
