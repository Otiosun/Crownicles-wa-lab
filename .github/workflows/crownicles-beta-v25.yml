name: Crownicles Beta — regressao segura

on:
  push:
    branches:
      - feat/crownicles-beta-group-ux-v25
      - feat/crownicles-beta-consolidation-v27
      - feat/crownicles-beta-menus-v28
      - feat/crownicles-beta-collector-safety-v29
      - feat/crownicles-beta-original-auth-v30
      - feat/crownicles-beta-final-consolidation
    paths:
      - 'integral-native-router/beta/entrada.cjs'
      - 'integral-native-router/beta/entrada.test.cjs'
      - 'integral-native-router/beta/owner-link.test.cjs'
      - 'integral-native-router/beta/response-context.cjs'
      - 'integral-native-router/beta/response-context.test.cjs'
      - 'integral-native-router/beta/group-identity-policy.cjs'
      - 'integral-native-router/beta/group-identity-policy.test.cjs'
      - 'integral-native-router/beta/group-sender.test.cjs'
      - 'integral-native-router/beta/group-sender.cjs'
      - 'integral-native-router/beta/context-dispatch.cjs'
      - 'integral-native-router/beta/context-dispatch.test.cjs'
      - 'integral-native-router/beta/integracao.cjs'
      - 'integral-native-router/beta/feature-manifest.cjs'
      - 'integral-native-router/beta/feature-manifest.test.cjs'
      - 'integral-native-router/beta/feature-integration.test.cjs'
      - 'integral-native-router/beta/collector-flow.test.cjs'
      - 'integral-native-router/beta/native-auth-v30.test.cjs'
      - 'integral-native-router/beta/startup-lock.cjs'
      - 'integral-native-router/beta/startup-lock.test.cjs'
      - 'integral-native-router/beta/native-expansion.test.cjs'
      - 'integral-native-router/beta/reviewed-live.test.cjs'
      - 'integral-native-router/beta/coverage-inventory.cjs'
      - 'integral-native-router/beta/coverage-inventory.test.cjs'
      - 'integral-native-router/beta/pet-transfer-collector.test.cjs'
      - 'integral-native-router/beta/pet-transfer-gateway.test.cjs'
      - 'integral-native-router/beta/native-live-safety.test.cjs'
      - 'integral-native-router/beta/multiuser-routing.test.cjs'
      - 'integral-native-router/beta/bridge/two-party-collector.cjs'
      - 'integral-native-router/beta/two-party-collector.test.cjs'
      - 'integral-native-router/beta/two-party-gateway.test.cjs'
      - 'integral-native-router/beta/bridge/social-intents.cjs'
      - 'integral-native-router/beta/social-intents.test.cjs'
      - 'integral-native-router/beta/social-gateway.test.cjs'
      - 'integral-native-router/beta/bridge/pet-transfer-collector.cjs'
      - 'integral-native-router/beta/bridge/pet-expedition-collector.cjs'
      - 'integral-native-router/beta/pet-expedition-collector.test.cjs'
      - 'integral-native-router/beta/bridge/**'
      - 'integral-native-router/beta/admin-link.cjs'
      - 'integral-native-router/beta/runtime.cjs'
      - '.github/workflows/crownicles-beta-v25.yml'
  pull_request:
    branches:
      - feat/crownicles-integral-native-router
      - feat/crownicles-beta-group-ux-v25
      - feat/crownicles-beta-consolidation-v27
      - feat/crownicles-beta-menus-v28
      - feat/crownicles-beta-collector-safety-v29
      - feat/crownicles-beta-original-auth-v30
    paths:
      - 'integral-native-router/beta/**'
      - '.github/workflows/crownicles-beta-v25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-beta:
    name: Regressao beta sem Baileys, MariaDB ou dados reais
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: integral-native-router/beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar versao e sintaxe
        run: |
          node --version
          node --check entrada.cjs
          node --check runtime.cjs
          node --check admin-link.cjs
          node --check entrada.test.cjs
          node --check owner-link.test.cjs
          node --check response-context.cjs
          node --check response-context.test.cjs
          node --check group-identity-policy.cjs
          node --check group-identity-policy.test.cjs
          node --check group-sender.cjs
          node --check group-sender.test.cjs
          node --check context-dispatch.cjs
          node --check context-dispatch.test.cjs
          node --check integracao.cjs
          node --check feature-manifest.cjs
          node --check feature-manifest.test.cjs
          node --check feature-integration.test.cjs
          node --check collector-flow.test.cjs
          node --check native-auth-v30.test.cjs
          node --check startup-lock.cjs
          node --check startup-lock.test.cjs
          node --check native-expansion.test.cjs
          node --check reviewed-live.test.cjs
          node --check coverage-inventory.cjs
          node --check coverage-inventory.test.cjs
          node --check bridge/pet-transfer-collector.cjs
          node --check pet-transfer-collector.test.cjs
          node --check pet-transfer-gateway.test.cjs
          node --check bridge/pet-expedition-collector.cjs
          node --check pet-expedition-collector.test.cjs
          node --check native-live-safety.test.cjs
          node --check multiuser-routing.test.cjs
          node --check bridge/two-party-collector.cjs
          node --check two-party-collector.test.cjs
          node --check two-party-gateway.test.cjs
          node --check bridge/social-intents.cjs
          node --check social-intents.test.cjs
          node --check social-gateway.test.cjs
          node --check bridge/lote08.cjs
          node --check patches/patch-v30.cjs
          for file in bridge/*.cjs; do node --check "$file"; done
      - name: Testar comandos, persistencia e seguranca em SQLite descartavel
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap *.test.cjs 2>&1 | tee "$RUNNER_TEMP/crownicles-beta-tests.tap"
      - name: Guardar relatorio completo dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownicles-beta-test-report
          path: ${{ runner.temp }}/crownicles-beta-tests.tap
          if-no-files-found: warn
          retention-days: 7
