# W07 targeted diagnostic: exact pinned original MQTT probe; isolated and read-only.
name: W07 public MQTT diagnostic
on:
  push:
    branches: ['lab/w07-mqtt-native-diagnostic-20261124']
    paths: ['.github/workflows/w07-mqtt-native-diagnostic.yml']
permissions:
  contents: read
jobs:
  mosquitto-native:
    if: ${{ github.repository == 'Otiosun/Crownicles-wa-lab' && github.event_name == 'push' && github.ref == 'refs/heads/lab/w07-mqtt-native-diagnostic-20261124' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CROWNICLES_P0C_NO_PRODUCTION: "true"
    steps:
      - name: Check out immutable already-public PR11 harness
        uses: actions/checkout@v4
        with:
          ref: 13471ab972847fbccb370172d077535b3140eceb
          persist-credentials: false
      - name: Verify exact unchanged W44 source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$CROWNICLES_P0C_NO_PRODUCTION" = true
          test "$GITHUB_REPOSITORY" = 'Otiosun/Crownicles-wa-lab'
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/w07-mqtt-native-diagnostic-20261124'
          test "$(git rev-parse HEAD)" = 13471ab972847fbccb370172d077535b3140eceb
          test "$GITHUB_WORKSPACE" != ''
          test "$(id -u)" != 0
          printf '%s\n' \
            '83b1729055cbb4027b68208811450937deb1d90090d404eff4a2b48526177beb  candidate/bridge/mqtt-auth-lab.cjs' \
            '8b6106bc10d63b8b2ee0391f41c2bcd101cdfc11b50ade0a96eab563825ca674  consolidated/evidence/e1-mqtt-w44-native-broker-probe.cjs' \
            '830f1638501477c943d4cc8303ce8b68dedaec0594a4283a01aa94204f5602c4  tools/w46_raw_mqtt_probe.cjs' \
            | sha256sum -c -
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native Mosquitto in disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mosquitto
          sudo systemctl stop mosquitto || true
          command -v mosquitto
          command -v mosquitto_passwd
          mosquitto -h 2>&1 | sed -n '1p'
      - name: Test wire-codec and W44 provenance without broker mocks claiming native
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/w46_raw_mqtt_probe.test.cjs
      - name: Execute authenticated real TCP MQTT broker/ACL probe
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          # No usernames, passwords or broker config are logged or uploaded.
          # Keep broker stderr local, report only a fixed classification. No policy changes.
          W07_DIR="$(mktemp -d)"
          chmod 700 "$W07_DIR"
          # A dedicated native broker config subtree on this disposable runner.
          # Do not change system service config, ACLs, AppArmor or permission policy.
          W07_LAB_ROOT="$(sudo mktemp -d /etc/mosquitto/w07-lab.XXXXXXXX)"
          case "$W07_LAB_ROOT" in /etc/mosquitto/w07-lab.*) ;; *) exit 1;; esac
          cleanup_w07() {
            local rc=$?
            trap - EXIT
            rm -rf -- "$W07_DIR"
            sudo rmdir -- "$W07_LAB_ROOT" || rc=1
            exit "$rc"
          }
          trap cleanup_w07 EXIT
          sudo chown "$(id -u):$(id -g)" "$W07_LAB_ROOT"
          test "$(stat -c '%a' "$W07_LAB_ROOT")" = 700
          test "$(stat -c '%u' "$W07_LAB_ROOT")" = "$(id -u)"
          export TMPDIR="$W07_LAB_ROOT"
          export W07_REAL_MOSQUITTO="$(command -v mosquitto)"
          export W07_BROKER_LOG="$W07_DIR/broker.log"
          case "$W07_REAL_MOSQUITTO" in /usr/sbin/mosquitto|/usr/bin/mosquitto) ;; *) exit 1;; esac
          cat > "$W07_DIR/mosquitto" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "-c" ]; then
            exec "$W07_REAL_MOSQUITTO" "$@" > "$W07_BROKER_LOG" 2>&1
          fi
          exec "$W07_REAL_MOSQUITTO" "$@"
          SH
          chmod 700 "$W07_DIR/mosquitto"
          export PATH="$W07_DIR:$PATH"
          set +e
          node tools/w46_raw_mqtt_probe.cjs "$GITHUB_WORKSPACE/candidate/bridge/mqtt-auth-lab.cjs" > mqtt-native-result.json
          rc=$?
          set -e
          python3 - "$W07_BROKER_LOG" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8", errors="replace").lower()[:65536] if p.exists() else ""
          tags = []
          for label, needles in (
              ("PERMISSION_DENIED", ("permission denied", "operation not permitted")),
              ("CONFIG_OPEN", ("unable to open config", "error opening config")),
              ("PASSWORD_FILE_OPEN", ("unable to open pwfile", "opening password file", "open password file")),
              ("ACL_FILE_OPEN", ("unable to open acl", "opening acl file", "open acl file")),
              ("PORT_IN_USE", ("address already in use",)),
              ("CONFIG_SYNTAX", ("unknown configuration", "invalid configuration", "error found at")),
              ("USER_ERROR", ("invalid user", "unable to change user", "unable to drop privileges")),
              ("ERROR_LOADING", ("error loading",)),
          ):
              if any(n in s for n in needles):
                  tags.append(label)
          print("W07_BROKER_STARTUP_TAGS=" + (",".join(tags) or ("UNCLASSIFIED" if s else "EMPTY")))
          PY
          python3 - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          r = json.load(open("mqtt-native-result.json", encoding="utf-8"))
          statuses = {"PASS", "FAIL", "BLOCKED"}
          reasons = {
              "NATIVE_MOSQUITTO_AUTH_DELIVERY_ACL_AND_BOTH_DIRECTIONS",
              "W44_SOURCE_ABSOLUTE_PATH_REQUIRED", "W44_SOURCE_SHA_MISMATCH",
              "RUN_AS_NONROOT_REQUIRED", "MOSQUITTO_BINARIES_MISSING",
              "MQTT_AUTH_DIRETORIO_INSEGURO", "MQTT_AUTH_PERMISSOES_DIRETORIO",
              "MQTT_AUTH_TOPICO_OU_PORTA", "MQTT_AUTH_ENTROPIA_INVALIDA",
              "MQTT_AUTH_HASH_FALHOU", "MQTT_AUTH_HASH_INVALIDO",
              "MQTT_AUTH_PERMISSOES_ARQUIVO", "MQTT_AUTH_PROVISIONAMENTO_FALHOU",
              "BROKER_EARLY_EXIT", "BROKER_NOT_READY", "MQTT_TIMEOUT",
              "MQTT_CONNECTION_LOST", "MQTT_CONNACK_INVALID", "MQTT_INVALID_PACKET",
              "ANONYMOUS_ACCEPTED", "BAD_PASSWORD_ACCEPTED", "VALID_AUTH_DENIED",
              "VALID_SUBSCRIPTION_DENIED", "MQTT_SUBACK_INVALID", "MQTT_SUBACK_UNEXPECTED",
              "MQTT_MESSAGE_TIMEOUT", "CROSS_TOPIC_READ_DELIVERED", "CROSS_TOPIC_PUBLISH_DELIVERED",
              "BROKER_SHUTDOWN_FAILED", "BROKER_CLEANUP_FAILED",
              "NATIVE_PROBE_EXCEPTION", "NATIVE_PROBE_UNHANDLED",
          }
          status = r.get("status") if r.get("status") in statuses else "UNKNOWN"
          reason = r.get("reason") if r.get("reason") in reasons else "REDACTED_UNKNOWN"
          print(f"W07_MQTT_NATIVE_RESULT status={status} reason={reason} rc={rc}", flush=True)
          assert r.get("schema") == "crownicles-w46-mqtt-native-v2"
          assert r.get("homologated") is False and r.get("productionTouched") is False
          assert rc == 0 and status == "PASS" and r.get("executedBroker") is True
          assert reason == "NATIVE_MOSQUITTO_AUTH_DELIVERY_ACL_AND_BOTH_DIRECTIONS"
          assert r.get("w44SourceSha256") == "83b1729055cbb4027b68208811450937deb1d90090d404eff4a2b48526177beb"
          assert r.get("coreOriginalExecuted") is False
          assert r.get("subscriptionSemantics") in ("ALL_DENIED_SUBACK", "GRANTS_POSSIBLE_DELIVERY_ACL_VERIFIED")
          print("W07_MQTT_BROKER_ACL_PASS_ONLY; CORE_WIRE_NOT_TESTED; GATES_OFF")
          PY
      - name: Preserve sanitized successful broker result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crownicles-w46-native-mqtt-result
          path: mqtt-native-result.json
          if-no-files-found: error
          retention-days: 2
