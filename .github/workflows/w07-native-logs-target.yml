# Disposable, owner-authorized one-branch public native proof. No production access.
# Existing manual workflows remain untouched. Never merge this experiment into main.
name: W07 targeted compiled LOGS native proof Node24
on:
  push:
    branches: ['lab/w07-native-logs-target-20261124']
    paths: ['.github/workflows/w07-native-logs-target.yml']
permissions:
  contents: read
concurrency:
  group: w07-native-logs-target
  cancel-in-progress: false
jobs:
  core-mariadb:
    if: ${{ github.repository == 'Otiosun/Crownicles-wa-lab' && github.event_name == 'push' && github.ref == 'refs/heads/lab/w07-native-logs-target-20261124' && github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: ci_only_root_7f53b1
          MARIADB_USER: draftbot
          MARIADB_PASSWORD: ci_only_game_6d39a4
          MARIADB_DATABASE: bootstrap_ci_only
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_ROOT_USER: root
      TEST_DB_ROOT_PASSWORD: ci_only_root_7f53b1
      TEST_DB_USER: draftbot
      TEST_DB_PASSWORD: ci_only_game_6d39a4
    steps:
      - name: Check out immutable already-public PR8 harness
        uses: actions/checkout@v4
        with:
          ref: 73039e929935652f099134f62b34236e121a8cea
          persist-credentials: false
      - name: Verify exact source and scope before tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Otiosun/Crownicles-wa-lab'
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = 'refs/heads/lab/w07-native-logs-target-20261124'
          test "$(git rev-parse HEAD)" = 73039e929935652f099134f62b34236e121a8cea
          test "$(id -u)" != 0
      - name: Verify complete pinned JUnit gate before native build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_verify_core_junit_full_suite.py' -v
      - name: Refuse other repos and non-isolated database targets
        shell: bash
        run: |
          set -euo pipefail
          test "$TEST_DB_HOST" = 127.0.0.1
          test "$TEST_DB_PORT" = 3306
          test -f integration/wa-equip-action.integration.test.ts
          test -f tools/verify_core_junit.py
      - name: Check out immutable upstream Crownicles (read-only)
        uses: actions/checkout@v4
        with:
          repository: Crownicles/Crownicles
          ref: 64d08c05f11949029317341735f6f73024f19f9b
          path: upstream
          persist-credentials: false
      - name: Pin exact official Core source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = 64d08c05f11949029317341735f6f73024f19f9b
          test -f upstream/Core/__tests__-integration/_coreSetup.ts
          test -f upstream/Core/__tests__-integration/_setup.ts
          test -f upstream/Core/vitest.integration.config.mts
          test -f upstream/Core/config/config.default.toml
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install official pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - name: Install original Lib and Core dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir upstream/Lib install --frozen-lockfile
          pnpm --dir upstream/Core install --frozen-lockfile
      - name: Prepare original bootstrap config for disposable runner
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/Core/config/config.default.toml upstream/Core/config/config.toml
          test -f upstream/Core/config/config.toml
          cp integration/wa-equip-action.integration.test.ts upstream/Core/__tests__-integration/handlers/wa-equip-action.integration.test.ts
      - name: Compile pinned upstream Core with TypeScript
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir upstream/Core run tsc
      - name: Prove real compiled LOGS boundary on Node24
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(cd upstream/Core && node -p "require('typescript/package.json').version")" = 6.0.3
          printf 'W07_NODE=%s W07_TS=6.0.3\n' "$(node --version)"
          cat > upstream/Core/__tests__-integration/migrations/w07-real-logs.integration.test.ts <<'TS'
          import { afterAll, beforeAll, describe, expect, it } from "vitest";
          import { createConnection } from "mariadb";
          import { QueryTypes, type Transaction } from "sequelize";
          import { botConfig } from "../../src/bootstrap";
          import { getIntegrationDbConfig } from "../_setup";
          import { setupCoreForTests, loadProductionModule, type CoreTestEnvironment } from "../_coreSetup";
          import type { LogsDatabase as LogsDatabaseType } from "../../src/core/database/logs/LogsDatabase";
          import { NumberChangeReason } from "../../../Lib/src/constants/LogsConstants";
          
          describe("W07 compiled LOGS with real MariaDB", () => {
              let env: CoreTestEnvironment;
              let logs: LogsDatabaseType;
              let bootstrap: typeof import("../../src/bootstrap");
              const rollback = new Error("W07 intentional rollback");
          
              beforeAll(async () => {
                  env = await setupCoreForTests("w07real_logs");
                  bootstrap = loadProductionModule<typeof import("../../src/bootstrap")>("bootstrap");
                  bootstrap.setBotConfigForTests(botConfig);
                  const { LogsDatabase } = loadProductionModule<typeof import("../../src/core/database/logs/LogsDatabase")>("core/database/logs/LogsDatabase");
                  logs = new LogsDatabase();
                  await logs.init(true);
                  await env.crownicles.gameDatabase.sequelize.query("CREATE TABLE w07_guard_probe (id INT PRIMARY KEY)");
              }, 120000);
          
              afterAll(async () => {
                  try {
                      await logs?.sequelize?.close();
                      if (env) {
                          if (!/^crownicles_test_[a-z0-9_]+$/.test(env.prefix)) throw new Error("W07 invalid disposable prefix");
                          const c = getIntegrationDbConfig();
                          const admin = await createConnection({host:c.host,port:c.port,user:c.rootUser,password:c.rootPassword});
                          try { await admin.query("DROP DATABASE IF EXISTS `" + env.prefix + "_logs`"); }
                          finally { await admin.end(); }
                      }
                  } finally {
                      bootstrap?.setBotConfigForTests(null);
                      await env?.teardown();
                  }
              }, 120000);
          
              async function logRows(key: string, tx?: Transaction) {
                  return logs.sequelize.query<{value:number,reason:number}>(
                      "SELECT m.value,m.reason FROM players_money m JOIN players p ON p.id=m.playerId WHERE p.keycloakId=:key ORDER BY m.value",
                      {type:QueryTypes.SELECT,replacements:{key},transaction:tx});
              }
              async function schema(tx?: Transaction | null) {
                  const rows = await logs.sequelize.query<{db:string}>("SELECT DATABASE() AS db",{type:QueryTypes.SELECT,transaction:tx});
                  return rows[0].db;
              }
              async function write(key:string,value:number) {
                  await logs.logMoneyChange(key,value,NumberChangeReason.TEST);
              }
          
              it("real fresh LOGS migrations and distinct GAME schema", async () => {
                  expect(await logs.umzug.pending()).toEqual([]);
                  expect((await logs.umzug.executed()).length).toBeGreaterThan(0);
                  expect(await schema()).toBe(env.prefix+"_logs");
                  const rows=await env.crownicles.gameDatabase.sequelize.query<{db:string}>("SELECT DATABASE() AS db",{type:QueryTypes.SELECT});
                  expect(rows[0].db).toBe(env.prefix+"_game");
              });
              it("real log method inserts money event", async () => {
                  await write("w07-normal",101);
                  expect(await logRows("w07-normal")).toEqual([{value:101,reason:NumberChangeReason.TEST}]);
              });
              it("explicit foreign GAME transaction routes to LOGS", async () => {
                  await env.crownicles.gameDatabase.sequelize.transaction(async tx => {
                      expect(await schema(tx)).toBe(env.prefix+"_logs");
                  });
              });
              it("inherited GAME transaction routes to LOGS and its rollback cannot erase log", async () => {
                  const game=env.crownicles.gameDatabase.sequelize;
                  await expect(game.transaction(async tx => {
                      await game.query("INSERT INTO w07_guard_probe VALUES (1)",{transaction:tx});
                      expect(await schema()).toBe(env.prefix+"_logs");
                      await write("w07-foreign-rollback",202);
                      throw rollback;
                  })).rejects.toThrow("W07 intentional rollback");
                  expect(await game.query("SELECT id FROM w07_guard_probe",{type:QueryTypes.SELECT})).toEqual([]);
                  expect(await logRows("w07-foreign-rollback")).toEqual([{value:202,reason:NumberChangeReason.TEST}]);
              });
              it("own LOGS rollback preserves atomicity", async () => {
                  await expect(logs.sequelize.transaction(async tx => {
                      await write("w07-own-rollback",303);
                      expect(await schema(tx)).toBe(env.prefix+"_logs");
                      expect(await logRows("w07-own-rollback",tx)).toEqual([{value:303,reason:NumberChangeReason.TEST}]);
                      throw rollback;
                  })).rejects.toThrow("W07 intentional rollback");
                  expect(await logRows("w07-own-rollback")).toEqual([]);
              });
              it("own LOGS transaction commits event", async () => {
                  await logs.sequelize.transaction(async tx => {
                      await write("w07-own-commit",404);
                      expect(await logRows("w07-own-commit",tx)).toEqual([{value:404,reason:NumberChangeReason.TEST}]);
                  });
                  expect(await logRows("w07-own-commit")).toEqual([{value:404,reason:NumberChangeReason.TEST}]);
              });
              it("explicit null inside GAME uses LOGS pool", async () => {
                  await env.crownicles.gameDatabase.sequelize.transaction(async () => {
                      expect(await schema(null)).toBe(env.prefix+"_logs");
                  });
              });
          });
          TS
          pnpm --dir upstream/Core exec vitest run --config vitest.integration.config.mts __tests__-integration/migrations/w07-real-logs.integration.test.ts
          cp upstream/Core/test-integration-results.xml w07-real-logs.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse("w07-real-logs.xml").getroot()
          cases=list(r.iter("testcase"))
          expected={
              "real fresh LOGS migrations and distinct GAME schema",
              "real log method inserts money event",
              "explicit foreign GAME transaction routes to LOGS",
              "inherited GAME transaction routes to LOGS and its rollback cannot erase log",
              "own LOGS rollback preserves atomicity",
              "own LOGS transaction commits event",
              "explicit null inside GAME uses LOGS pool",
          }
          assert len(cases)==7
          assert r.tag=='testsuites' and r.get('tests')=='7' and r.get('failures')=='0' and r.get('errors')=='0'
          suites=list(r.iter('testsuite'))
          assert len(suites)==1 and suites[0].get('tests')=='7' and suites[0].get('skipped')=='0'
          assert all(c.get('classname')=='__tests__-integration/migrations/w07-real-logs.integration.test.ts' for c in cases)
          assert {c.get('name') for c in cases}=={'W07 compiled LOGS with real MariaDB > '+n for n in expected}
          assert not any(list(c.iter(k)) for c in cases for k in ("failure","error","skipped"))
          print("W07_NATIVE_LOGS_REAL_CLASS_7_OF_7_NODE24_TS6")
          PY
      - name: Negative control removes only compiled query guard in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          target=upstream/Core/dist/Core/src/core/database/logs/LogsDatabase.js
          test -f "$target"
          original="$(mktemp)"
          cp "$target" "$original"
          trap 'cp "$original" "$target"; rm -f "$original"' EXIT
          python3 - "$target" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          s=p.read_text()
          needle="this.installForeignTransactionGuard();"
          assert s.count(needle)==1
          p.write_text(s.replace(needle,"/* W07 test-only guard removal */"))
          PY
          set +e
          pnpm --dir upstream/Core exec vitest run --config vitest.integration.config.mts __tests__-integration/migrations/w07-real-logs.integration.test.ts -t "explicit foreign GAME transaction routes to LOGS"
          rc=$?
          set -e
          test "$rc" != 0
          cp upstream/Core/test-integration-results.xml w07-logs-negative.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse("w07-logs-negative.xml").getroot().iter("testcase"))
          failed=[c for c in cases if c.find("failure") is not None]
          assert len(failed)==1
          assert failed[0].get("name")=="W07 compiled LOGS with real MariaDB > explicit foreign GAME transaction routes to LOGS"
          detail=ET.tostring(failed[0].find("failure"),encoding="unicode")
          assert "_logs" in detail and "_game" in detail
          print("W07_LOGS_GUARD_NEGATIVE_CONTROL_CAUSAL")
          PY
          cp "$original" "$target"
          cmp "$original" "$target"
      - name: Upload sanitized laboratory evidence on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crownicles-w07-targeted-logs-audit
          path: |
            w07-real-logs.xml
            w07-logs-negative.xml
          if-no-files-found: error
          retention-days: 2
